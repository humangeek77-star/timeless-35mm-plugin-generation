<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Timeless 35mm Reconstruction</title>
    <style>
        /* overflow-x: auto and overflow-y: auto activates dual scrollbars if panel space scales tight */
        body { background-color: #1E1E1E; color: #E6E6E6; font-family: sans-serif; padding: 15px; margin: 0; font-size: 12px; overflow-y: auto; overflow-x: auto; height: 100vh; box-sizing: border-box; }
        h3 { color: #FFF; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .control-group { margin-bottom: 12px; display: flex; flex-direction: column; min-width: 240px; }
        label { margin-bottom: 4px; color: #B3B3B3; font-weight: bold; white-space: nowrap; }
        select, input[type="range"], button { background-color: #2D2D2D; color: #FFF; border: 1px solid #454545; padding: 6px; border-radius: 4px; font-size: 12px; }
        select:focus, input[type="range"]:focus { border-color: #1473E6; outline: none; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
        input[type="range"] { flex-grow: 1; margin-right: 10px; min-width: 120px; }
        .val-display { min-width: 35px; text-align: right; color: #1473E6; font-weight: bold; }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; min-width: 240px; }
        button { font-weight: bold; cursor: pointer; padding: 10px; flex-grow: 1; border: none; white-space: nowrap; }
        #processBtn { background-color: #1473E6; }
        #processBtn:hover { background-color: #0D59B3; }
        #resetBtn { background-color: #454545; max-width: 80px; }
        #status-box { background: #151515; border: 1px solid #333; padding: 8px; margin-top: 12px; border-radius: 4px; font-family: monospace; color: #8CE10B; height: 50px; overflow-y: auto; min-width: 240px; }
        
        /* Modern scrollbar styling for dual scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #151515; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #1473E6; }
    </style>
</head>
<body>
    <h3>Timeless 35mm UXP Engine</h3>
    <div class="control-group">
        <label for="eraDropdown">1. Target Cinematic Era</label>
        <select id="eraDropdown">
            <option value="">Select Era...</option>
            <option value="1950s Cinema">1950s Cinema</option>
            <option value="1970s New Hollywood Realism">1970s New Hollywood Realism</option>
            <option value="1980s Neo-Noir / Fantasy">1980s Neo-Noir / Fantasy</option>
        </select>
    </div>
    <div class="control-group">
        <label for="cameraDropdown">2. Optional Camera Modification</label>
        <select id="cameraDropdown" disabled>
            <option value="">Select Camera Profile...</option>
        </select>
    </div>
    <div class="control-group">
        <label for="balanceDropdown">3. Chemical Color Balance</label>
        <select id="balanceDropdown">
            <option value="warm">Daylight Balanced (Warm / Saturated / Natural)</option>
            <option value="cool">Tungsten Balanced (Cool / Cyan-Noir / Moody)</option>
        </select>
    </div>
    <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
    <div class="control-group"><label>Lens Edge Blur</label><div class="slider-row"><input type="range" id="slider-mtf" min="0" max="30" value="0"><span class="val-display" id="val-mtf">0px</span></div></div>
    <div class="control-group"><label>Halation Threshold</label><div class="slider-row"><input type="range" id="slider-thresh" min="150" max="255" value="255"><span class="val-display" id="val-thresh">255</span></div></div>
    <div class="control-group"><label>Halation Radius</label><div class="slider-row"><input type="range" id="slider-hblur" min="5" max="101" step="2" value="5"><span class="val-display" id="val-hblur">5px</span></div></div>
    <div class="control-group"><label>Halation Intensity</label><div class="slider-row"><input type="range" id="slider-hint" min="0.0" max="1.5" step="0.05" value="0.00"><span class="val-display" id="val-hint">0.00</span></div></div>
    <div class="control-group"><label>Grain Intensity</label><div class="slider-row"><input type="range" id="slider-gint" min="0.00" max="0.15" step="0.005" value="0.000"><span class="val-display" id="val-gint">0.000</span></div></div>
    <div class="control-group"><label>Grain Scale Gauge</label><div class="slider-row"><input type="range" id="slider-gsize" min="0.5" max="2.5" step="0.05" value="1.00"><span class="val-display" id="val-gsize">1.00x</span></div></div>
    <div class="btn-container">
        <button id="resetBtn">RESET</button>
        <button id="processBtn">PROCESS ACTIVE TIMELINE CLIP</button>
    </div>
    <div id="status-box">Status: Ready. Highlight a timeline clip on Track 1.</div>

    <script>
        // Safe UXP / Node / Web runtime detection to prevent load crashes
        let exec = null, path = null, os = null, app = null;
        try {
            if (typeof require !== 'undefined') {
                try { exec = require('child_process')?.exec || null; } catch (_) {}
                try { path = require('path'); } catch (_) {}
                try { os = require('os'); } catch (_) {}
                try { app = require('premierepro'); } catch (_) {}
            } else if (typeof window !== 'undefined' && window.require) {
                try { exec = window.require('child_process')?.exec || null; } catch (_) {}
                try { path = window.require('path'); } catch (_) {}
                try { os = window.require('os'); } catch (_) {}
                try { app = window.require('premierepro'); } catch (_) {}
            }
        } catch (_) {}
        if (!app && typeof window !== 'undefined' && window.app) {
            app = window.app;
        }
        
        // === REPLACE THE DATA STRUCTURES IN INDEX.HTML WITH THIS VERSION ===
        const eraBaselines = {
            "1950s Cinema": { mtf: 14, thresh: 230, h_blur: 41, h_int: 0.50, g_int: 0.050, g_size: 1.30 },
            "1970s New Hollywood Realism": { mtf: 20, thresh: 215, h_blur: 45, h_int: 0.60, g_int: 0.065, g_size: 1.45 },
            "1980s Neo-Noir / Fantasy": { mtf: 8,  thresh: 230, h_blur: 31, h_int: 0.35, g_int: 0.040, g_size: 1.10 }
        };

        const cameraModifiers = {
            "1950s Cinema": {
                "Technicolor Three-Strip (Process 4)": { mtf: 12, thresh: 195, h_blur: 65, h_int: 0.95, g_int: 0.035, g_size: 1.1 },
                "Arriflex 16ST (German Cinema Glass)": { mtf: 24, thresh: 220, h_blur: 35, h_int: 0.45, g_int: 0.080, g_size: 1.8 },
                "Mitchell Standard (Studio Spherical)": { mtf: 14, thresh: 230, h_blur: 41, h_int: 0.50, g_int: 0.050, g_size: 1.3 }
            },
            "1970s New Hollywood Realism": {
                "Panavision PSR (Spherical Reality)": { mtf: 18, thresh: 225, h_blur: 35, h_int: 0.40, g_int: 0.060, g_size: 1.4 },
                "Arriflex 35 IIC (Gritty Street)": { mtf: 22, thresh: 205, h_blur: 61, h_int: 0.80, g_int: 0.075, g_size: 1.55 }
            },
            "1980s Neo-Noir / Fantasy": {
                "Panaflex Gold (C-Series Anamorphic)": { mtf: 15, thresh: 210, h_blur: 51, h_int: 0.65, g_int: 0.045, g_size: 1.25 },
                "Arriflex 35 BL-4 (Zeiss Super Speed Mark II)": { mtf: 7, thresh: 229, h_blur: 31, h_int: 0.35, g_int: 0.040, g_size: 1.1 }
            }
        };

        // Fallback compatibility aliases
        eraBaselines["1950s"] = eraBaselines["1950s Cinema"];
        eraBaselines["1970s"] = eraBaselines["1970s New Hollywood Realism"];
        eraBaselines["1980s"] = eraBaselines["1980s Neo-Noir / Fantasy"];
        cameraModifiers["1950s"] = cameraModifiers["1950s Cinema"];
        cameraModifiers["1970s"] = cameraModifiers["1970s New Hollywood Realism"];
        cameraModifiers["1980s"] = cameraModifiers["1980s Neo-Noir / Fantasy"];

        // DOM Element Selections
        const eraDropdown = document.getElementById('eraDropdown');
        const eraSelect = eraDropdown;
        const cameraDropdown = document.getElementById('cameraDropdown');
        const camSelect = cameraDropdown;
        const balanceDropdown = document.getElementById('balanceDropdown');

        const sliderMtf = document.getElementById('slider-mtf');
        const sliderThresh = document.getElementById('slider-thresh');
        const sliderHblur = document.getElementById('slider-hblur');
        const sliderHint = document.getElementById('slider-hint');
        const sliderGint = document.getElementById('slider-gint');
        const sliderGsize = document.getElementById('slider-gsize');

        const valMtf = document.getElementById('val-mtf');
        const valThresh = document.getElementById('val-thresh');
        const valHblur = document.getElementById('val-hblur');
        const valHint = document.getElementById('val-hint');
        const valGint = document.getElementById('val-gint');
        const valGsize = document.getElementById('val-gsize');

        const resetBtn = document.getElementById('resetBtn');
        const processBtn = document.getElementById('processBtn');
        const statusBox = document.getElementById('status-box');

        function updateDisplays() {
            valMtf.textContent = `${sliderMtf.value}px`;
            valThresh.textContent = `${sliderThresh.value}`;
            valHblur.textContent = `${sliderHblur.value}px`;
            valHint.textContent = parseFloat(sliderHint.value).toFixed(2);
            valGint.textContent = parseFloat(sliderGint.value).toFixed(3);
            valGsize.textContent = `${parseFloat(sliderGsize.value).toFixed(2)}x`;
        }
        const updateSliderUIDisplays = updateDisplays;

        function setSliderValues(vals) {
            if (vals.mtf !== undefined) sliderMtf.value = vals.mtf;
            if (vals.thresh !== undefined) sliderThresh.value = vals.thresh;
            if (vals.h_blur !== undefined) sliderHblur.value = vals.h_blur;
            if (vals.h_int !== undefined) sliderHint.value = vals.h_int;
            if (vals.g_int !== undefined) sliderGint.value = vals.g_int;
            if (vals.g_size !== undefined) sliderGsize.value = vals.g_size;
            updateSliderUIDisplays();
        }

        function resetToDefaults() {
            camSelect.disabled = true;
            camSelect.innerHTML = '<option value="">Select Camera Profile...</option>';
            document.getElementById('slider-mtf').value = 0;
            document.getElementById('slider-thresh').value = 255;
            document.getElementById('slider-hblur').value = 5;
            document.getElementById('slider-hint').value = 0.0;
            document.getElementById('slider-gint').value = 0.000;
            document.getElementById('slider-gsize').value = 1.00;
            updateSliderUIDisplays();
            statusBox.innerText = "Status: Ready. Select an Era.";
        }

        // === REPLACE THE ERASELECT CHANGE LISTENER IN INDEX.HTML WITH THIS ===
        function handleEraChange(e) {
            // Reset and wipe the camera dropdown clean
            camSelect.innerHTML = '<option value="">Select Camera Profile...</option>';
            const selectedEra = (e && e.target && e.target.value) || (this && this.value) || eraSelect.value;

            if (selectedEra && eraBaselines[selectedEra]) {
                // 1. Instantly snap sliders to the baseline film data
                const base = eraBaselines[selectedEra];
                document.getElementById('slider-mtf').value = base.mtf;
                document.getElementById('slider-thresh').value = base.thresh;
                document.getElementById('slider-hblur').value = base.h_blur;
                document.getElementById('slider-hint').value = base.h_int;
                document.getElementById('slider-gint').value = base.g_int;
                document.getElementById('slider-gsize').value = base.g_size;
                updateSliderUIDisplays();
                statusBox.innerText = `Status: ${selectedEra} film baseline applied.`;

                // 2. Unlock and populate the secondary tier dropdown using an ultra-stable loop
                camSelect.disabled = false;
                camSelect.removeAttribute('disabled');
                const eraCams = cameraModifiers[selectedEra];
                if (eraCams) {
                    for (var camKey in eraCams) {
                        if (Object.prototype.hasOwnProperty.call(eraCams, camKey)) {
                            var opt = document.createElement('option');
                            opt.value = camKey;
                            opt.textContent = camKey;
                            opt.innerText = camKey;
                            opt.innerHTML = camKey;
                            camSelect.appendChild(opt);
                        }
                    }
                }
            } else {
                resetToDefaults();
            }
        }
        eraSelect.addEventListener('change', handleEraChange);
        eraSelect.addEventListener('input', handleEraChange);
        // ======================================================================

        function handleCameraChange(e) {
            const era = eraSelect.value;
            const cam = (e && e.target && e.target.value) || (this && this.value) || camSelect.value;
            if (era && cam && cameraModifiers[era] && cameraModifiers[era][cam]) {
                setSliderValues(cameraModifiers[era][cam]);
                statusBox.innerText = `Status: Applied camera modifier: ${cam}`;
            } else if (era && eraBaselines[era]) {
                setSliderValues(eraBaselines[era]);
                statusBox.innerText = `Status: Reverted to ${era} baseline profile.`;
            }
        }
        camSelect.addEventListener('change', handleCameraChange);
        camSelect.addEventListener('input', handleCameraChange);

        // Sliders realtime display update
        [sliderMtf, sliderThresh, sliderHblur, sliderHint, sliderGint, sliderGsize].forEach(slider => {
            slider.addEventListener('input', updateDisplays);
        });

        // Reset Button
        resetBtn.addEventListener('click', () => {
            eraSelect.value = "";
            balanceDropdown.value = "warm";
            resetToDefaults();
            statusBox.innerText = "Status: Reset to defaults. Highlight a clip on Track 1.";
        });

        // Scroll Wheel Navigation for Sliders & Dropdowns
        [
            { el: sliderMtf, step: 2, min: 0, max: 30, decimals: 0 },
            { el: sliderThresh, step: 2, min: 150, max: 255, decimals: 0 },
            { el: sliderHblur, step: 2, min: 5, max: 101, decimals: 0 },
            { el: sliderHint, step: 0.05, min: 0.0, max: 1.5, decimals: 2 },
            { el: sliderGint, step: 0.005, min: 0.00, max: 0.15, decimals: 3 },
            { el: sliderGsize, step: 0.05, min: 0.5, max: 2.5, decimals: 2 }
        ].forEach(({ el, step, min, max, decimals }) => {
            el.addEventListener('wheel', (e) => {
                e.preventDefault();
                const direction = e.deltaY < 0 ? 1 : -1;
                let val = parseFloat(el.value) + (direction * step);
                val = Math.max(min, Math.min(max, val));
                el.value = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
                updateDisplays();
            }, { passive: false });
        });

        [eraDropdown, cameraDropdown, balanceDropdown].forEach(dd => {
            dd.addEventListener('wheel', (e) => {
                if (dd.disabled) return;
                e.preventDefault();
                const direction = e.deltaY < 0 ? -1 : 1;
                const nextIdx = dd.selectedIndex + direction;
                if (nextIdx >= 0 && nextIdx < dd.options.length) {
                    dd.selectedIndex = nextIdx;
                    dd.dispatchEvent(new Event('change'));
                }
            }, { passive: false });
        });

        // Asynchronous UXP Premiere Pro Timeline Process Execution
        processBtn.addEventListener('click', async () => {
            statusBox.textContent = "Status: Querying active sequence selection...";
            processBtn.disabled = true;

            try {
                // If Premiere Pro environment is not present (e.g. web browser preview)
                if (!app) {
                    throw new Error("Adobe Premiere Pro environment not detected. Please run inside Premiere Pro UXP to process timeline clips.");
                }

                // Resolve active project (UXP async pattern with fallback)
                let project = null;
                if (app.Project && typeof app.Project.getActiveProject === 'function') {
                    project = await app.Project.getActiveProject();
                } else if (typeof app.getActiveProject === 'function') {
                    project = await app.getActiveProject();
                } else if (app.project) {
                    project = app.project;
                }

                if (!project) {
                    throw new Error("No active project found. Open a project in Premiere Pro.");
                }

                // Resolve active sequence (UXP async pattern with fallback)
                let activeSeq = null;
                if (typeof project.getActiveSequence === 'function') {
                    activeSeq = await project.getActiveSequence();
                } else if (project.activeSequence) {
                    activeSeq = project.activeSequence;
                } else if (typeof app.getActiveSequence === 'function') {
                    activeSeq = await app.getActiveSequence();
                } else if (app.activeSequence) {
                    activeSeq = app.activeSequence;
                }

                if (!activeSeq) {
                    throw new Error("No active sequence found. Open a sequence in Premiere Pro.");
                }

                // Asynchronously get selection
                let selection = null;
                if (typeof activeSeq.getSelection === 'function') {
                    selection = await activeSeq.getSelection();
                } else if (activeSeq.selection) {
                    selection = activeSeq.selection;
                }

                if (!selection || selection.length === 0) {
                    throw new Error("No clip selected on timeline. Highlight a clip on Track 1.");
                }

                // Cross-reference Track 1 (videoTracks[0])
                let targetClip = null;
                try {
                    const videoTracks = activeSeq.videoTracks;
                    if (videoTracks && videoTracks.length > 0) {
                        const track1 = videoTracks[0];
                        if (track1 && track1.clips) {
                            const track1Clips = Array.from(track1.clips);
                            targetClip = selection.find(selItem =>
                                track1Clips.some(c => c === selItem || c.nodeId === selItem.nodeId || (c.name && c.name === selItem.name))
                            );
                        }
                    }
                } catch (tErr) {
                    console.warn("Track query note:", tErr);
                }

                if (!targetClip) {
                    targetClip = selection[0];
                }

                statusBox.textContent = `Status: Resolving path for clip "${targetClip.name || "Selected Clip"}"...`;

                // Resolve media path
                let mediaPath = null;
                if (targetClip.projectItem) {
                    if (typeof targetClip.projectItem.getMediaPath === 'function') {
                        mediaPath = await targetClip.projectItem.getMediaPath();
                    } else if (targetClip.projectItem.mediaPath) {
                        mediaPath = targetClip.projectItem.mediaPath;
                    }
                } else if (typeof targetClip.getMediaPath === 'function') {
                    mediaPath = await targetClip.getMediaPath();
                } else if (targetClip.mediaPath) {
                    mediaPath = targetClip.mediaPath;
                }

                if (!mediaPath) {
                    throw new Error("Could not resolve disk media path for selected clip.");
                }

                // Read parameters from UI
                const mtf = parseInt(sliderMtf.value, 10);
                const thresh = parseInt(sliderThresh.value, 10);
                const h_blur = parseInt(sliderHblur.value, 10);
                const h_int = parseFloat(sliderHint.value);
                const g_int = parseFloat(sliderGint.value);
                const g_size = parseFloat(sliderGsize.value);
                const balance = balanceDropdown.value;

                // --- REPLACE THE OLD PATH LOGIC BLOCK WITH THIS ---
                const fs = require('fs');
                const os = require('os');
                const path = require('path');

                // Natively query the absolute system directory where Adobe is hosting our UXP files
                const pluginDir = require('uxp').storage.localFileSystem.getPluginFolder().nativePath;
                const pythonScriptPath = path.join(pluginDir, "timeless.py");
                const outputMasterPath = mediaPath.replace(/(\.[\w\d]+)$/i, '_Timeless35mm.mp4');

                const localUser = os.userInfo().username;
                const directPythonPath = `C:\\Users\\${localUser}\\AppData\\Local\\Microsoft\\WindowsApps\\python.exe`;

                const cmdString = `"${directPythonPath}" "${pythonScriptPath}" --input "${mediaPath}" --output "${outputMasterPath}" --mtf ${mtf} --thresh ${thresh} --h_blur ${h_blur} --h_int ${h_int} --g_int ${g_int} --g_size ${g_size} --balance ${balance}`;
                // --------------------------------------------------

                statusBox.textContent = `Status: Processing 35mm Reconstruction via Python OpenCV...`;

                exec(cmdString, (error, stdout, stderr) => {
                    processBtn.disabled = false;
                    if (error) {
                        statusBox.textContent = `Status Error: ${error.message}`;
                        return;
                    }
                    statusBox.textContent = `Status: Success! Saved to ${outputMasterPath}`;

                    // Auto-import to Premiere Pro Project bin
                    try {
                        if (project && typeof project.importFiles === 'function') {
                            project.importFiles([outputMasterPath], true, project.rootItem || null, false);
                        } else if (app && app.project && typeof app.project.importFiles === 'function') {
                            app.project.importFiles([outputMasterPath], true, app.project.rootItem, false);
                        }
                    } catch (importErr) {
                        console.warn("Auto-import note:", importErr);
                    }
                });

            } catch (err) {
                processBtn.disabled = false;
                statusBox.textContent = `Status Error: ${err.message}`;
            }
        });

        // Initialize display values
        updateDisplays();
    </script>
</body>
</html>
