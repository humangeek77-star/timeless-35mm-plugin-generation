<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Timeless 35mm Reconstruction</title>
    <style>
        /* overflow-x: auto and overflow-y: auto activates dual scrollbars if panel space scales tight */
        body { background-color: #1E1E1E; color: #E6E6E6; font-family: sans-serif; padding: 15px; margin: 0; font-size: 12px; overflow-y: auto; overflow-x: auto; height: 100vh; box-sizing: border-box; }
        h3 { color: #FFF; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .control-group { margin-bottom: 12px; display: flex; flex-direction: column; min-width: 240px; }
        label { margin-bottom: 4px; color: #B3B3B3; font-weight: bold; white-space: nowrap; }
        select, input[type="range"], button { background-color: #2D2D2D; color: #FFF; border: 1px solid #454545; padding: 6px; border-radius: 4px; font-size: 12px; }
        select:focus, input[type="range"]:focus { border-color: #1473E6; outline: none; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
        input[type="range"] { flex-grow: 1; margin-right: 10px; min-width: 120px; }
        .val-display { min-width: 35px; text-align: right; color: #1473E6; font-weight: bold; }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; min-width: 240px; }
        button { font-weight: bold; cursor: pointer; padding: 10px; flex-grow: 1; border: none; white-space: nowrap; }
        #processBtn { background-color: #1473E6; }
        #processBtn:hover { background-color: #0D59B3; }
        #resetBtn { background-color: #454545; max-width: 80px; }
        #status-box { background: #151515; border: 1px solid #333; padding: 8px; margin-top: 12px; border-radius: 4px; font-family: monospace; color: #8CE10B; height: 50px; overflow-y: auto; min-width: 240px; }
        
        /* Modern scrollbar styling for dual scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #151515; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #1473E6; }
    </style>
</head>
<body>
    <h3>Timeless 35mm UXP Engine</h3>
    <div class="control-group">
        <label for="eraDropdown">1. Target Cinematic Era</label>
        <select id="eraDropdown">
            <option value="">Select Era...</option>
            <option value="1950s Cinema">1950s Cinema</option>
            <option value="1970s New Hollywood Realism">1970s New Hollywood Realism</option>
            <option value="1980s Neo-Noir / Fantasy">1980s Neo-Noir / Fantasy</option>
        </select>
    </div>
    <div class="control-group">
        <label for="cameraDropdown">2. Optional Camera Modification</label>
        <select id="cameraDropdown" disabled>
            <option value="">Select Camera Profile...</option>
        </select>
    </div>
    <div class="control-group">
        <label for="balanceDropdown">3. Chemical Color Balance</label>
        <select id="balanceDropdown">
            <option value="warm">Daylight Balanced (Warm / Saturated / Natural)</option>
            <option value="cool">Tungsten Balanced (Cool / Cyan-Noir / Moody)</option>
        </select>
    </div>
    <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
    <div class="control-group"><label>Lens Edge Blur</label><div class="slider-row"><input type="range" id="slider-mtf" min="0" max="30" value="0"><span class="val-display" id="val-mtf">0px</span></div></div>
    <div class="control-group"><label>Halation Threshold</label><div class="slider-row"><input type="range" id="slider-thresh" min="150" max="255" value="255"><span class="val-display" id="val-thresh">255</span></div></div>
    <div class="control-group"><label>Halation Radius</label><div class="slider-row"><input type="range" id="slider-hblur" min="5" max="101" step="2" value="5"><span class="val-display" id="val-hblur">5px</span></div></div>
    <div class="control-group"><label>Halation Intensity</label><div class="slider-row"><input type="range" id="slider-hint" min="0.0" max="1.5" step="0.05" value="0.00"><span class="val-display" id="val-hint">0.00</span></div></div>
    <div class="control-group"><label>Grain Intensity</label><div class="slider-row"><input type="range" id="slider-gint" min="0.00" max="0.15" step="0.005" value="0.000"><span class="val-display" id="val-gint">0.000</span></div></div>
    <div class="control-group"><label>Grain Scale Gauge</label><div class="slider-row"><input type="range" id="slider-gsize" min="0.5" max="2.5" step="0.05" value="1.00"><span class="val-display" id="val-gsize">1.00x</span></div></div>
    <div class="btn-container">
        <button id="resetBtn">RESET</button>
        <button id="processBtn">PROCESS ACTIVE TIMELINE CLIP</button>
    </div>

    <!-- Live 35mm Reconstruction Progress Bar -->
    <div id="progress-wrapper" style="display: none; margin: 14px 0 6px 0; background: #141414; padding: 10px 12px; border-radius: 6px; border: 1px solid #282828;">
        <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #bbb; font-weight: 500;">
            <span id="progress-label">Rendering 35mm Reconstruction...</span>
            <span id="progress-percentage" style="color: #f39c12; font-weight: bold;">0.0%</span>
        </div>
        <div style="width: 100%; height: 9px; background: #1f1f1f; border-radius: 5px; overflow: hidden; border: 1px solid #333; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);">
            <div id="progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #d4af37, #f39c12); transition: width 0.25s ease; border-radius: 4px;"></div>
        </div>
        <div id="progress-details" style="font-size: 10px; color: #777; margin-top: 5px; text-align: right; font-family: monospace;">0 / 0 frames (0.0 fps)</div>
    </div>

    <div id="status-box">Status: Ready. Highlight a timeline clip on Track 1.</div>

    <script>
        // Safe UXP / Node / Web runtime detection to prevent load crashes
        let exec = null, path = null, os = null, app = null;
        try {
            if (typeof require !== 'undefined') {
                try { exec = require('child_process')?.exec || null; } catch (_) {}
                try { path = require('path'); } catch (_) {}
                try { os = require('os'); } catch (_) {}
                try { app = require('premierepro'); } catch (_) {}
            } else if (typeof window !== 'undefined' && window.require) {
                try { exec = window.require('child_process')?.exec || null; } catch (_) {}
                try { path = window.require('path'); } catch (_) {}
                try { os = window.require('os'); } catch (_) {}
                try { app = window.require('premierepro'); } catch (_) {}
            }
        } catch (_) {}
        if (!app && typeof window !== 'undefined' && window.app) {
            app = window.app;
        }
        
        // === REPLACE THE DATA STRUCTURES IN INDEX.HTML WITH THIS VERSION ===
        const eraBaselines = {
            "1950s Cinema": { mtf: 14, thresh: 230, h_blur: 41, h_int: 0.50, g_int: 0.050, g_size: 1.30 },
            "1970s New Hollywood Realism": { mtf: 20, thresh: 215, h_blur: 45, h_int: 0.60, g_int: 0.065, g_size: 1.45 },
            "1980s Neo-Noir / Fantasy": { mtf: 8,  thresh: 230, h_blur: 31, h_int: 0.35, g_int: 0.040, g_size: 1.10 }
        };

        const cameraModifiers = {
            "1950s Cinema": {
                "Technicolor Three-Strip (Process 4)": { mtf: 12, thresh: 195, h_blur: 65, h_int: 0.95, g_int: 0.035, g_size: 1.1 },
                "Arriflex 16ST (German Cinema Glass)": { mtf: 24, thresh: 220, h_blur: 35, h_int: 0.45, g_int: 0.080, g_size: 1.8 },
                "Mitchell Standard (Studio Spherical)": { mtf: 14, thresh: 230, h_blur: 41, h_int: 0.50, g_int: 0.050, g_size: 1.3 }
            },
            "1970s New Hollywood Realism": {
                "Panavision PSR (Spherical Reality)": { mtf: 18, thresh: 225, h_blur: 35, h_int: 0.40, g_int: 0.060, g_size: 1.4 },
                "Arriflex 35 IIC (Gritty Street)": { mtf: 22, thresh: 205, h_blur: 61, h_int: 0.80, g_int: 0.075, g_size: 1.55 }
            },
            "1980s Neo-Noir / Fantasy": {
                "Panaflex Gold (C-Series Anamorphic)": { mtf: 15, thresh: 210, h_blur: 51, h_int: 0.65, g_int: 0.045, g_size: 1.25 },
                "Arriflex 35 BL-4 (Zeiss Super Speed Mark II)": { mtf: 7, thresh: 229, h_blur: 31, h_int: 0.35, g_int: 0.040, g_size: 1.1 }
            }
        };

        // Fallback compatibility aliases
        eraBaselines["1950s"] = eraBaselines["1950s Cinema"];
        eraBaselines["1970s"] = eraBaselines["1970s New Hollywood Realism"];
        eraBaselines["1980s"] = eraBaselines["1980s Neo-Noir / Fantasy"];
        cameraModifiers["1950s"] = cameraModifiers["1950s Cinema"];
        cameraModifiers["1970s"] = cameraModifiers["1970s New Hollywood Realism"];
        cameraModifiers["1980s"] = cameraModifiers["1980s Neo-Noir / Fantasy"];

        // DOM Element Selections
        const eraDropdown = document.getElementById('eraDropdown');
        const eraSelect = eraDropdown;
        const cameraDropdown = document.getElementById('cameraDropdown');
        const camSelect = cameraDropdown;
        const balanceDropdown = document.getElementById('balanceDropdown');

        const sliderMtf = document.getElementById('slider-mtf');
        const sliderThresh = document.getElementById('slider-thresh');
        const sliderHblur = document.getElementById('slider-hblur');
        const sliderHint = document.getElementById('slider-hint');
        const sliderGint = document.getElementById('slider-gint');
        const sliderGsize = document.getElementById('slider-gsize');

        const valMtf = document.getElementById('val-mtf');
        const valThresh = document.getElementById('val-thresh');
        const valHblur = document.getElementById('val-hblur');
        const valHint = document.getElementById('val-hint');
        const valGint = document.getElementById('val-gint');
        const valGsize = document.getElementById('val-gsize');

        const resetBtn = document.getElementById('resetBtn');
        const processBtn = document.getElementById('processBtn');
        const statusBox = document.getElementById('status-box');

        // Progress Bar Elements & Helpers
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressLabel = document.getElementById('progress-label');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressFill = document.getElementById('progress-fill');
        const progressDetails = document.getElementById('progress-details');

        function updateProgressUI(pct, label, details, isComplete = false) {
            if (progressWrapper) progressWrapper.style.display = 'block';
            if (progressPercentage) progressPercentage.textContent = `${pct.toFixed(1)}%`;
            if (progressFill) {
                progressFill.style.width = `${pct}%`;
                if (isComplete) {
                    progressFill.style.background = '#27ae60';
                } else {
                    progressFill.style.background = 'linear-gradient(90deg, #d4af37, #f39c12)';
                }
            }
            if (progressLabel && label) progressLabel.textContent = label;
            if (progressDetails && details) progressDetails.textContent = details;
        }

        function resetProgressUI() {
            if (progressWrapper) progressWrapper.style.display = 'none';
            if (progressFill) {
                progressFill.style.width = '0%';
                progressFill.style.background = 'linear-gradient(90deg, #d4af37, #f39c12)';
            }
            if (progressPercentage) progressPercentage.textContent = '0.0%';
            if (progressDetails) progressDetails.textContent = '0 / 0 frames (0.0 fps)';
            if (progressLabel) progressLabel.textContent = 'Rendering 35mm Reconstruction...';
        }

        function updateDisplays() {
            valMtf.textContent = `${sliderMtf.value}px`;
            valThresh.textContent = `${sliderThresh.value}`;
            valHblur.textContent = `${sliderHblur.value}px`;
            valHint.textContent = parseFloat(sliderHint.value).toFixed(2);
            valGint.textContent = parseFloat(sliderGint.value).toFixed(3);
            valGsize.textContent = `${parseFloat(sliderGsize.value).toFixed(2)}x`;
        }
        const updateSliderUIDisplays = updateDisplays;

        function setSliderValues(vals) {
            if (vals.mtf !== undefined) sliderMtf.value = vals.mtf;
            if (vals.thresh !== undefined) sliderThresh.value = vals.thresh;
            if (vals.h_blur !== undefined) sliderHblur.value = vals.h_blur;
            if (vals.h_int !== undefined) sliderHint.value = vals.h_int;
            if (vals.g_int !== undefined) sliderGint.value = vals.g_int;
            if (vals.g_size !== undefined) sliderGsize.value = vals.g_size;
            updateSliderUIDisplays();
        }

        function resetToDefaults() {
            camSelect.disabled = true;
            camSelect.innerHTML = '<option value="">Select Camera Profile...</option>';
            document.getElementById('slider-mtf').value = 0;
            document.getElementById('slider-thresh').value = 255;
            document.getElementById('slider-hblur').value = 5;
            document.getElementById('slider-hint').value = 0.0;
            document.getElementById('slider-gint').value = 0.000;
            document.getElementById('slider-gsize').value = 1.00;
            updateSliderUIDisplays();
            statusBox.innerText = "Status: Ready. Select an Era.";
        }

        // === REPLACE THE ERASELECT CHANGE LISTENER IN INDEX.HTML WITH THIS ===
        function handleEraChange(e) {
            // Reset and wipe the camera dropdown clean
            camSelect.innerHTML = '<option value="">Select Camera Profile...</option>';
            const selectedEra = (e && e.target && e.target.value) || (this && this.value) || eraSelect.value;

            if (selectedEra && eraBaselines[selectedEra]) {
                // 1. Instantly snap sliders to the baseline film data
                const base = eraBaselines[selectedEra];
                document.getElementById('slider-mtf').value = base.mtf;
                document.getElementById('slider-thresh').value = base.thresh;
                document.getElementById('slider-hblur').value = base.h_blur;
                document.getElementById('slider-hint').value = base.h_int;
                document.getElementById('slider-gint').value = base.g_int;
                document.getElementById('slider-gsize').value = base.g_size;
                updateSliderUIDisplays();
                statusBox.innerText = `Status: ${selectedEra} film baseline applied.`;

                // 2. Unlock and populate the secondary tier dropdown using an ultra-stable loop
                camSelect.disabled = false;
                camSelect.removeAttribute('disabled');
                const eraCams = cameraModifiers[selectedEra];
                if (eraCams) {
                    for (var camKey in eraCams) {
                        if (Object.prototype.hasOwnProperty.call(eraCams, camKey)) {
                            var opt = document.createElement('option');
                            opt.value = camKey;
                            opt.textContent = camKey;
                            opt.innerText = camKey;
                            opt.innerHTML = camKey;
                            camSelect.appendChild(opt);
                        }
                    }
                }
            } else {
                resetToDefaults();
            }
        }
        eraSelect.addEventListener('change', handleEraChange);
        eraSelect.addEventListener('input', handleEraChange);
        // ======================================================================

        function handleCameraChange(e) {
            const era = eraSelect.value;
            const cam = (e && e.target && e.target.value) || (this && this.value) || camSelect.value;
            if (era && cam && cameraModifiers[era] && cameraModifiers[era][cam]) {
                setSliderValues(cameraModifiers[era][cam]);
                statusBox.innerText = `Status: Applied camera modifier: ${cam}`;
            } else if (era && eraBaselines[era]) {
                setSliderValues(eraBaselines[era]);
                statusBox.innerText = `Status: Reverted to ${era} baseline profile.`;
            }
        }
        camSelect.addEventListener('change', handleCameraChange);
        camSelect.addEventListener('input', handleCameraChange);

        // Sliders realtime display update
        [sliderMtf, sliderThresh, sliderHblur, sliderHint, sliderGint, sliderGsize].forEach(slider => {
            slider.addEventListener('input', updateDisplays);
        });

        // Reset Button
        resetBtn.addEventListener('click', () => {
            eraSelect.value = "";
            balanceDropdown.value = "warm";
            resetToDefaults();
            resetProgressUI();
            statusBox.innerText = "Status: Reset to defaults. Highlight a clip on Track 1.";
        });

        // Scroll Wheel Navigation for Sliders & Dropdowns
        [
            { el: sliderMtf, step: 2, min: 0, max: 30, decimals: 0 },
            { el: sliderThresh, step: 2, min: 150, max: 255, decimals: 0 },
            { el: sliderHblur, step: 2, min: 5, max: 101, decimals: 0 },
            { el: sliderHint, step: 0.05, min: 0.0, max: 1.5, decimals: 2 },
            { el: sliderGint, step: 0.005, min: 0.00, max: 0.15, decimals: 3 },
            { el: sliderGsize, step: 0.05, min: 0.5, max: 2.5, decimals: 2 }
        ].forEach(({ el, step, min, max, decimals }) => {
            el.addEventListener('wheel', (e) => {
                e.preventDefault();
                const direction = e.deltaY < 0 ? 1 : -1;
                let val = parseFloat(el.value) + (direction * step);
                val = Math.max(min, Math.min(max, val));
                el.value = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
                updateDisplays();
            }, { passive: false });
        });

        [eraDropdown, cameraDropdown, balanceDropdown].forEach(dd => {
            dd.addEventListener('wheel', (e) => {
                if (dd.disabled) return;
                e.preventDefault();
                const direction = e.deltaY < 0 ? -1 : 1;
                const nextIdx = dd.selectedIndex + direction;
                if (nextIdx >= 0 && nextIdx < dd.options.length) {
                    dd.selectedIndex = nextIdx;
                    dd.dispatchEvent(new Event('change'));
                }
            }, { passive: false });
        });

        // Asynchronous UXP Premiere Pro Timeline Process Execution
        processBtn.addEventListener('click', async () => {
            statusBox.textContent = "Status: Querying active sequence selection...";
            processBtn.disabled = true;

            try {
                // If Premiere Pro environment is not present (e.g. web browser preview)
                if (!app) {
                    throw new Error("Adobe Premiere Pro environment not detected. Please run inside Premiere Pro UXP to process timeline clips.");
                }

                // Resolve active project (UXP async pattern with fallback)
                let project = null;
                if (app.Project && typeof app.Project.getActiveProject === 'function') {
                    project = await app.Project.getActiveProject();
                } else if (typeof app.getActiveProject === 'function') {
                    project = await app.getActiveProject();
                } else if (app.project) {
                    project = app.project;
                }

                if (!project) {
                    throw new Error("No active project found. Open a project in Premiere Pro.");
                }

                // Resolve active sequence (UXP async pattern with fallback)
                let activeSeq = null;
                if (typeof project.getActiveSequence === 'function') {
                    activeSeq = await project.getActiveSequence();
                } else if (project.activeSequence) {
                    activeSeq = project.activeSequence;
                } else if (typeof app.getActiveSequence === 'function') {
                    activeSeq = await app.getActiveSequence();
                } else if (app.activeSequence) {
                    activeSeq = app.activeSequence;
                }

                if (!activeSeq) {
                    throw new Error("No active sequence found. Open a sequence in Premiere Pro.");
                }

                // 1. Asynchronously retrieve timeline selection
                let selectionObj = null;
                if (typeof activeSeq.getSelection === 'function') {
                    selectionObj = await activeSeq.getSelection();
                } else if (activeSeq.selection) {
                    selectionObj = activeSeq.selection;
                }

                // 2. Extract selected items (UXP TrackItemSelection vs vanilla Array)
                let selectedItems = [];
                if (selectionObj) {
                    if (typeof selectionObj.getTrackItems === 'function') {
                        try {
                            const raw = await selectionObj.getTrackItems();
                            selectedItems = Array.isArray(raw) ? raw : Array.from(raw || []);
                        } catch (e) {
                            console.warn("selection.getTrackItems() error:", e);
                        }
                    } else if (Array.isArray(selectionObj)) {
                        selectedItems = selectionObj;
                    } else if (selectionObj.trackItems) {
                        selectedItems = Array.isArray(selectionObj.trackItems) ? selectionObj.trackItems : Array.from(selectionObj.trackItems);
                    } else if (selectionObj.items) {
                        selectedItems = Array.isArray(selectionObj.items) ? selectionObj.items : Array.from(selectionObj.items);
                    } else if (typeof selectionObj.numItems === 'number') {
                        selectedItems = [];
                        for (let i = 0; i < selectionObj.numItems; i++) {
                            const item = typeof selectionObj.getItemAt === 'function' ? selectionObj.getItemAt(i) : selectionObj[i];
                            if (item) selectedItems.push(item);
                        }
                    }
                }

                // 3. Fallback: If no selection returned from getSelection(), inspect Track 1 (V1)
                if (!selectedItems || selectedItems.length === 0) {
                    try {
                        let track1 = null;
                        if (typeof activeSeq.getVideoTrack === 'function') {
                            track1 = await activeSeq.getVideoTrack(0);
                        } else if (activeSeq.videoTracks && activeSeq.videoTracks.length > 0) {
                            track1 = activeSeq.videoTracks[0];
                        }

                        if (track1) {
                            let trackClips = [];
                            if (typeof track1.getTrackItems === 'function') {
                                trackClips = await track1.getTrackItems(1, false);
                            } else if (track1.clips) {
                                trackClips = Array.from(track1.clips);
                            }

                            if (trackClips && trackClips.length > 0) {
                                const markedSelected = trackClips.find(c => c && (c.isSelected || c.selected));
                                if (markedSelected) {
                                    selectedItems = [markedSelected];
                                } else if (trackClips.length === 1) {
                                    selectedItems = [trackClips[0]];
                                } else {
                                    selectedItems = [trackClips[0]];
                                }
                            }
                        }
                    } catch (tErr) {
                        console.warn("Track 1 query note:", tErr);
                    }
                }

                if (!selectedItems || selectedItems.length === 0 || !selectedItems[0]) {
                    throw new Error("No clip selected on timeline. Highlight a clip on Track 1.");
                }

                const targetClip = selectedItems[0];
                const targetTrackItem = targetClip;

                // Asynchronously extract clip name (UXP getName() method vs name property)
                let clipName = "";
                if (typeof targetClip.getName === 'function') {
                    try { clipName = await targetClip.getName(); } catch (_) {}
                }
                if (!clipName && targetClip.name) {
                    clipName = targetClip.name;
                }

                // Asynchronously extract linked projectItem (UXP getProjectItem() method vs projectItem property)
                let projItem = null;
                if (typeof targetClip.getProjectItem === 'function') {
                    try { projItem = await targetClip.getProjectItem(); } catch (_) {}
                }
                if (!projItem && targetClip.projectItem) {
                    projItem = targetClip.projectItem;
                }

                // If clipName is still empty, query it from projItem
                if (!clipName && projItem) {
                    if (typeof projItem.getName === 'function') {
                        try { clipName = await projItem.getName(); } catch (_) {}
                    }
                    if (!clipName && projItem.name) {
                        clipName = projItem.name;
                    }
                }

                if (!clipName) {
                    clipName = "Selected Clip";
                }

                statusBox.textContent = `Status: Resolving path for clip "${clipName}"...`;

                // 4. Resolve media path via modern UXP ClipProjectItem cast, direct getters, and Project bin search
                let mediaPath = null;

                // Strategy A: Cast to ClipProjectItem (modern UXP 25+)
                try {
                    const pproModule = (typeof require !== 'undefined' ? require('premierepro') : window.premierepro) || app;
                    const ClipProjectItemClass = pproModule?.ClipProjectItem || app?.ClipProjectItem;
                    if (ClipProjectItemClass && projItem) {
                        const castItem = typeof ClipProjectItemClass.cast === 'function' ? ClipProjectItemClass.cast(projItem) : null;
                        if (castItem) {
                            if (typeof castItem.getMediaFilePath === 'function') {
                                mediaPath = await castItem.getMediaFilePath();
                            } else if (typeof castItem.getMediaPath === 'function') {
                                mediaPath = await castItem.getMediaPath();
                            } else if (castItem.mediaPath) {
                                mediaPath = castItem.mediaPath;
                            }
                        }
                    }
                } catch (cErr) {
                    console.warn("ClipProjectItem cast note:", cErr);
                }

                // Strategy B: Direct methods on projItem
                if (!mediaPath && projItem) {
                    try {
                        if (typeof projItem.getMediaFilePath === 'function') {
                            mediaPath = await projItem.getMediaFilePath();
                        } else if (typeof projItem.getMediaPath === 'function') {
                            mediaPath = await projItem.getMediaPath();
                        } else if (projItem.mediaPath) {
                            mediaPath = projItem.mediaPath;
                        } else if (projItem.treePath) {
                            mediaPath = projItem.treePath;
                        }
                    } catch (pErr) {
                        console.warn("projItem path note:", pErr);
                    }
                }

                // Strategy C: Methods directly on targetClip
                if (!mediaPath && targetClip) {
                    try {
                        if (typeof targetClip.getMediaFilePath === 'function') {
                            mediaPath = await targetClip.getMediaFilePath();
                        } else if (typeof targetClip.getMediaPath === 'function') {
                            mediaPath = await targetClip.getMediaPath();
                        } else if (targetClip.mediaPath) {
                            mediaPath = targetClip.mediaPath;
                        }
                    } catch (tErr) {
                        console.warn("targetClip path note:", tErr);
                    }
                }

                // Strategy D: Search project rootItem bin for matching item name
                if (!mediaPath && project && project.rootItem && project.rootItem.children) {
                    try {
                        const cleanName = (clipName || "").replace(/\s*\[[AV\d]+\]\s*$/i, "").trim().toLowerCase();
                        const cleanBase = cleanName.replace(/\.[a-z0-9]+$/i, "").trim().toLowerCase();
                        const childrenCollection = project.rootItem.children;
                        const total = typeof childrenCollection.numItems === 'number' ? childrenCollection.numItems : (childrenCollection.length || 0);

                        for (let k = 0; k < total; k++) {
                            const binItem = typeof childrenCollection.getItemAt === 'function' ? childrenCollection.getItemAt(k) : childrenCollection[k];
                            if (!binItem) continue;
                            let binItemName = binItem.name || "";
                            if (!binItemName && typeof binItem.getName === 'function') {
                                try { binItemName = await binItem.getName(); } catch (_) {}
                            }
                            binItemName = (binItemName || "").trim().toLowerCase();
                            const binBase = binItemName.replace(/\.[a-z0-9]+$/i, "").trim().toLowerCase();

                            // Compare names
                            const matches = (binItemName === cleanName) ||
                                            (cleanBase && binItemName.includes(cleanBase)) ||
                                            (binBase && cleanName.includes(binBase)) ||
                                            (cleanBase && cleanBase === binBase);

                            if (matches) {
                                try {
                                    const pproModule = (typeof require !== 'undefined' ? require('premierepro') : window.premierepro) || app;
                                    const ClipProjectItemClass = pproModule?.ClipProjectItem || app?.ClipProjectItem;
                                    if (ClipProjectItemClass && typeof ClipProjectItemClass.cast === 'function') {
                                        const castBin = ClipProjectItemClass.cast(binItem);
                                        if (castBin) {
                                            if (typeof castBin.getMediaFilePath === 'function') mediaPath = await castBin.getMediaFilePath();
                                            else if (typeof castBin.getMediaPath === 'function') mediaPath = await castBin.getMediaPath();
                                            else if (castBin.mediaPath) mediaPath = castBin.mediaPath;
                                        }
                                    }
                                } catch (_) {}

                                if (!mediaPath) {
                                    if (typeof binItem.getMediaFilePath === 'function') {
                                        mediaPath = await binItem.getMediaFilePath();
                                    } else if (typeof binItem.getMediaPath === 'function') {
                                        mediaPath = await binItem.getMediaPath();
                                    } else if (binItem.mediaPath) {
                                        mediaPath = binItem.mediaPath;
                                    } else if (binItem.treePath) {
                                        mediaPath = binItem.treePath;
                                    }
                                }

                                if (mediaPath) break;
                            }
                        }
                    } catch (binErr) {
                        console.warn("Bin media resolution note:", binErr);
                    }
                }

                // Strategy E: Standalone video asset fallback from project bin
                if (!mediaPath && project && project.rootItem && project.rootItem.children) {
                    try {
                        const childrenCollection = project.rootItem.children;
                        const total = typeof childrenCollection.numItems === 'number' ? childrenCollection.numItems : (childrenCollection.length || 0);

                        for (let k = 0; k < total; k++) {
                            const item = typeof childrenCollection.getItemAt === 'function' ? childrenCollection.getItemAt(k) : childrenCollection[k];
                            if (!item) continue;
                            let itemPath = null;
                            try {
                                const pproModule = (typeof require !== 'undefined' ? require('premierepro') : window.premierepro) || app;
                                const ClipProjectItemClass = pproModule?.ClipProjectItem || app?.ClipProjectItem;
                                const cast = ClipProjectItemClass?.cast ? ClipProjectItemClass.cast(item) : item;
                                if (cast && typeof cast.getMediaFilePath === 'function') {
                                    itemPath = await cast.getMediaFilePath();
                                } else if (typeof item.getMediaFilePath === 'function') {
                                    itemPath = await item.getMediaFilePath();
                                } else if (typeof item.getMediaPath === 'function') {
                                    itemPath = await item.getMediaPath();
                                } else if (item.mediaPath) {
                                    itemPath = item.mediaPath;
                                }
                            } catch (_) {}

                            if (itemPath && typeof itemPath === 'string' && itemPath.match(/\.(mp4|mov|m4v|avi|mkv|wmv|mxf|r3d|braw|prores)$/i)) {
                                mediaPath = itemPath;
                                console.log("Resolved mediaPath via bin video asset fallback:", mediaPath);
                                break;
                            }
                        }
                    } catch (e) {
                        console.warn("Bin video fallback query note:", e);
                    }
                }

                if (!mediaPath) {
                    throw new Error(`Could not resolve disk media path for clip "${clipName}". Ensure clip media is linked to a file on disk.`);
                }

                // Read parameters from UI
                const mtf = parseInt(sliderMtf.value, 10);
                const thresh = parseInt(sliderThresh.value, 10);
                const h_blur = parseInt(sliderHblur.value, 10);
                const h_int = parseFloat(sliderHint.value);
                const g_int = parseFloat(sliderGint.value);
                const g_size = parseFloat(sliderGsize.value);
                const balance = balanceDropdown.value;

                // --- NATIVE UXP SYSTEM & PROCESS RESOLUTION BLOCK ---
                function safePathJoin(...segments) {
                    return segments
                        .filter(s => typeof s === 'string' && s.length > 0)
                        .map((seg, i) => i === 0 ? seg.replace(/[\\/]+$/, '') : seg.replace(/^[\\/]+|[\\/]+$/g, ''))
                        .filter(Boolean)
                        .join('\\');
                }

                let uxpFs = null, uxpOs = null, uxpPath = null, uxpModule = null;
                try { if (typeof require !== 'undefined') uxpFs = require('fs'); } catch (_) {}
                if (!uxpFs && typeof window !== 'undefined' && window.fs) uxpFs = window.fs;

                try { if (typeof require !== 'undefined') uxpOs = require('os'); } catch (_) {}
                if (!uxpOs && typeof window !== 'undefined' && window.os) uxpOs = window.os;

                try { if (typeof require !== 'undefined') uxpPath = require('path'); } catch (_) {}
                if (!uxpPath && typeof window !== 'undefined' && window.path) uxpPath = window.path;

                try { if (typeof require !== 'undefined') uxpModule = require('uxp'); } catch (_) {}
                if (!uxpModule && typeof window !== 'undefined' && window.uxp) uxpModule = window.uxp;

                // Ensure path.join is guaranteed to exist and never throws in UXP
                const pathObj = uxpPath || {};
                if (typeof pathObj.join !== 'function') {
                    pathObj.join = safePathJoin;
                }

                // Natively query the absolute system directory where Adobe is hosting our UXP files (async Folder resolution)
                let pluginDir = "";
                try {
                    if (uxpModule?.storage?.localFileSystem) {
                        const pluginFolder = await uxpModule.storage.localFileSystem.getPluginFolder();
                        pluginDir = pluginFolder?.nativePath || "";
                    }
                } catch (pErr) {
                    console.warn("Could not retrieve plugin folder via UXP:", pErr);
                }
                if (!pluginDir && typeof __dirname !== 'undefined') {
                    pluginDir = __dirname;
                }

                const pythonScriptPath = pluginDir ? pathObj.join(pluginDir, "timeless.py") : "timeless.py";
                const outputMasterPath = mediaPath.replace(/(\.[\w\d]+)$/i, '_Timeless35mm.mp4');

                // Safely determine local username with fallbacks for UXP environment
                let localUser = "tommy";
                try {
                    if (uxpOs && typeof uxpOs.userInfo === 'function') {
                        const info = uxpOs.userInfo();
                        if (info && info.username) localUser = info.username;
                    } else if (uxpOs && typeof uxpOs.homedir === 'function') {
                        const parts = uxpOs.homedir().split(/[\\/]/);
                        if (parts.length > 0 && parts[parts.length - 1]) localUser = parts[parts.length - 1];
                    } else if (typeof process !== 'undefined' && process.env) {
                        localUser = process.env.USERNAME || process.env.USER || localUser;
                    }
                } catch (_) {}

                const directPythonPath = `C:\\Users\\${localUser}\\AppData\\Local\\Microsoft\\WindowsApps\\python.exe`;

                const mediaDir = mediaPath.substring(0, Math.max(mediaPath.lastIndexOf('/'), mediaPath.lastIndexOf('\\')));
                const progressJsonPath = safePathJoin(mediaDir, "timeless_progress.json");

                const cmdString = `"${directPythonPath}" "${pythonScriptPath}" --input "${mediaPath}" --output "${outputMasterPath}" --mtf ${mtf} --thresh ${thresh} --h_blur ${h_blur} --h_int ${h_int} --g_int ${g_int} --g_size ${g_size} --balance ${balance} --progress "${progressJsonPath}"`;
                // --------------------------------------------------

                statusBox.textContent = `Status: Processing 35mm Reconstruction via Python OpenCV...`;
                updateProgressUI(0, "Initializing Engine...", "Preparing video frames...", false);

                // Universal helper functions for UXP fs shim (which lacks existsSync)
                function safeFileExists(filePath) {
                    if (!uxpFs) return false;
                    try {
                        if (typeof uxpFs.existsSync === 'function') return uxpFs.existsSync(filePath);
                        if (typeof uxpFs.statSync === 'function') return !!uxpFs.statSync(filePath);
                        if (typeof uxpFs.readFileSync === 'function') { uxpFs.readFileSync(filePath, 'utf8'); return true; }
                    } catch (_) {}
                    return false;
                }

                function safeReadTextFile(filePath) {
                    if (!uxpFs) return null;
                    try {
                        if (typeof uxpFs.readFileSync === 'function') return uxpFs.readFileSync(filePath, 'utf8');
                    } catch (_) {}
                    return null;
                }

                function safeDeleteFile(filePath) {
                    if (!uxpFs) return;
                    try {
                        if (typeof uxpFs.unlinkSync === 'function') uxpFs.unlinkSync(filePath);
                    } catch (_) {}
                }

                // Universal command executor: supports child_process.exec or UXP shell.openPath with robust .bat runner
                const executeProcessingCommand = async (cmd) => {
                    let execFn = null;
                    try {
                        if (typeof exec === 'function') execFn = exec;
                        else if (typeof require !== 'undefined') execFn = require('child_process')?.exec;
                        else if (window.require) execFn = window.require('child_process')?.exec;
                    } catch (_) {}

                    if (typeof execFn === 'function') {
                        return new Promise((resolve, reject) => {
                            execFn(cmd, (error, stdout, stderr) => {
                                if (error) reject(error);
                                else resolve({ stdout, stderr });
                            });
                        });
                    }

                    // UXP Sandbox fallback: launch via uxp.shell.openPath using a runner batch file
                    const shell = uxpModule?.shell;
                    if (shell && typeof shell.openPath === 'function') {
                        const batPath = safePathJoin(mediaDir, "timeless_runner.bat");
                        const doneFlag = safePathJoin(mediaDir, "timeless_runner.done");
                        const errFlag = safePathJoin(mediaDir, "timeless_runner.err");
                        const logPath = safePathJoin(mediaDir, "timeless_runner.log");

                        safeDeleteFile(doneFlag);
                        safeDeleteFile(errFlag);
                        safeDeleteFile(logPath);
                        safeDeleteFile(progressJsonPath);

                        // Auto-detect working python binary in batch runner
                        const batScript = `@echo off\r\nsetlocal enabledelayedexpansion\r\n` +
                            `set "PY_BIN="\r\n` +
                            `if exist "${directPythonPath}" (\r\n  "${directPythonPath}" -c "import sys" >nul 2>&1\r\n  if !ERRORLEVEL! EQU 0 set "PY_BIN=${directPythonPath}"\r\n)\r\n` +
                            `if not defined PY_BIN (\r\n  python -c "import sys" >nul 2>&1\r\n  if !ERRORLEVEL! EQU 0 set "PY_BIN=python"\r\n)\r\n` +
                            `if not defined PY_BIN (\r\n  py -c "import sys" >nul 2>&1\r\n  if !ERRORLEVEL! EQU 0 set "PY_BIN=py"\r\n)\r\n` +
                            `if not defined PY_BIN (\r\n  for /d %%D in ("%LOCALAPPDATA%\\Programs\\Python\\Python*") do (\r\n    if exist "%%D\\python.exe" (\r\n      "%%D\\python.exe" -c "import sys" >nul 2>&1\r\n      if !ERRORLEVEL! EQU 0 set "PY_BIN=%%D\\python.exe"\r\n    )\r\n  )\r\n)\r\n` +
                            `if not defined PY_BIN set "PY_BIN=${directPythonPath}"\r\n` +
                            `"!PY_BIN!" "${pythonScriptPath}" --input "${mediaPath}" --output "${outputMasterPath}" --mtf ${mtf} --thresh ${thresh} --h_blur ${h_blur} --h_int ${h_int} --g_int ${g_int} --g_size ${g_size} --balance ${balance} --progress "${progressJsonPath}" > "${logPath}" 2>&1\r\n` +
                            `if !ERRORLEVEL! EQU 0 (\r\n  echo OK > "${doneFlag}"\r\n) else (\r\n  echo ERROR: !ERRORLEVEL! > "${errFlag}"\r\n)\r\n` +
                            `exit\r\n`;

                        if (uxpFs && typeof uxpFs.writeFileSync === 'function') {
                            uxpFs.writeFileSync(batPath, batScript);
                        } else if (uxpFs && typeof uxpFs.writeFile === 'function') {
                            await uxpFs.writeFile(batPath, batScript);
                        }

                        statusBox.textContent = `Status: Security Prompt: Please click "Allow" on the Adobe Permission dialog to start processing...`;
                        updateProgressUI(0, "Awaiting Permission...", "Click 'Allow' on the Adobe popup dialog", false);

                        await shell.openPath(batPath, "Authorize Timeless 35mm to run Python OpenCV reconstruction.");

                        // Immediately update UI to indicate process launch
                        statusBox.textContent = "Status: Process launched. Starting Python render engine...";
                        updateProgressUI(0, "Launching Render Engine...", "Running timeless.py frame processor...", false);

                        let lastActivityTime = Date.now();
                        let lastReportedFrame = 0;
                        let hasStartedRendering = false;

                        while (true) {
                            await new Promise(r => setTimeout(r, 400));

                            // 1. Read live frame-by-frame progress emitted by Python
                            const progContent = safeReadTextFile(progressJsonPath);
                            if (progContent) {
                                try {
                                    const pData = JSON.parse(progContent);
                                    if (pData && typeof pData.percent === 'number') {
                                        const pct = Math.min(100.0, Math.max(0.0, pData.percent));
                                        const curF = pData.frame || 0;
                                        const totF = pData.total || 0;
                                        const fps = pData.fps || 0;
                                        const stageName = pData.stage ? `[${pData.stage}] ` : "";

                                        hasStartedRendering = true;
                                        updateProgressUI(
                                            pct,
                                            pct >= 100 ? "Compiling 35mm Master..." : `${stageName}Rendering 35mm Film Frames...`,
                                            `${curF} / ${totF} frames (${fps} fps)`,
                                            pct >= 100
                                        );
                                        statusBox.textContent = `Status: Processing 35mm Reconstruction (${pct.toFixed(0)}%)...`;

                                        if (curF > lastReportedFrame || pData.stage === "Initializing" || pData.stage === "Starting") {
                                            lastReportedFrame = curF;
                                            lastActivityTime = Date.now(); // RESET STALL TIMER
                                        }
                                    }
                                } catch (_) {}
                            }

                            // 2. Check for script failure
                            const errContent = safeReadTextFile(errFlag);
                            if (errContent !== null) {
                                const logContent = safeReadTextFile(logPath) || "";
                                safeDeleteFile(batPath);
                                safeDeleteFile(errFlag);
                                safeDeleteFile(progressJsonPath);
                                throw new Error(`Python rendering script failed: ${logContent ? logContent.slice(0, 300) : errContent.trim()}`);
                            }

                            // 3. Check for completion flag
                            const doneContent = safeReadTextFile(doneFlag);
                            if (doneContent !== null) {
                                updateProgressUI(100.0, "Rendering Complete!", "Master compiled successfully", true);
                                safeDeleteFile(batPath);
                                safeDeleteFile(doneFlag);
                                safeDeleteFile(logPath);
                                safeDeleteFile(progressJsonPath);
                                return { stdout: "Reconstruction completed via UXP shell launcher" };
                            }

                            // Also check master file if progress is 100%
                            if (safeFileExists(outputMasterPath) && hasStartedRendering) {
                                try {
                                    const stat = uxpFs.statSync(outputMasterPath);
                                    if (stat && stat.size > 2000 && lastReportedFrame > 0) {
                                        const p = JSON.parse(safeReadTextFile(progressJsonPath) || "{}");
                                        if (p && p.percent >= 100) {
                                            updateProgressUI(100.0, "Rendering Complete!", "Master compiled successfully", true);
                                            safeDeleteFile(batPath);
                                            safeDeleteFile(doneFlag);
                                            safeDeleteFile(logPath);
                                            safeDeleteFile(progressJsonPath);
                                            return { stdout: "Reconstruction completed via UXP shell launcher" };
                                        }
                                    }
                                } catch (_) {}
                            }

                            // 4. Stall detection (only triggers if 120 seconds pass with zero progress)
                            if (Date.now() - lastActivityTime > 120000) {
                                throw new Error("Pipeline stalled: No frames processed for 120 seconds. Ensure Python has OpenCV installed.");
                            }
                        }
                    }

                    throw new Error("Execution method not available (neither child_process.exec nor uxp.shell.openPath supported).");
                };

                try {
                    await executeProcessingCommand(cmdString);
                } catch (cmdError) {
                    processBtn.disabled = false;
                    statusBox.innerText = `Pipeline Error: ${cmdError.message}`;
                    updateProgressUI(0, "Pipeline Stopped", cmdError.message, false);
                    return;
                }

                statusBox.innerText = "Status: Finalizing clip mutation...";
                updateProgressUI(100.0, "Importing Asset...", "Adding master file to Premiere bin", true);

                try {
                    // Natively import the newly processed master file into the project bin
                    await project.importFiles([outputMasterPath], false, project.rootItem, false);

                    // Convert the internal UXP children iterable collection safely into a vanilla array
                    const childrenCollection = project.rootItem.children;
                    const totalItems = typeof childrenCollection.numItems === 'number' ? childrenCollection.numItems : (childrenCollection.length || 0);

                    let foundAsset = null;

                    // Safely extract elements using UXP collection retrieval methods
                    for (let j = 0; j < totalItems; j++) {
                        let currentItem = null;
                        if (typeof childrenCollection.getItemAt === 'function') {
                            currentItem = childrenCollection.getItemAt(j);
                        } else {
                            currentItem = childrenCollection[j];
                        }
                        if (!currentItem) continue;

                        let currentName = currentItem.name || "";
                        if (!currentName && typeof currentItem.getName === 'function') {
                            try { currentName = await currentItem.getName(); } catch (_) {}
                        }

                        if (currentName && currentName.indexOf('_Timeless35mm') !== -1) {
                            foundAsset = currentItem;
                            break;
                        }
                    }

                    if (foundAsset) {
                        let sourceSwapped = false;
                        if (typeof targetTrackItem.changeSource === 'function') {
                            try {
                                await targetTrackItem.changeSource(foundAsset);
                                sourceSwapped = true;
                            } catch (csErr) {
                                console.warn("changeSource note:", csErr);
                            }
                        }

                        if (!sourceSwapped) {
                            try {
                                const pproModule = (typeof require !== 'undefined' ? require('premierepro') : window.premierepro) || app;
                                if (pproModule?.SequenceEditor && activeSeq) {
                                    const editor = pproModule.SequenceEditor.getEditor(activeSeq);
                                    const startTime = typeof targetTrackItem.getStartTime === 'function' ? await targetTrackItem.getStartTime() : (targetTrackItem.start || 0);
                                    if (typeof project.executeTransaction === 'function') {
                                        await project.executeTransaction(compound => {
                                            compound.addAction(editor.createOverwriteItemAction(foundAsset, startTime, 0, 0));
                                        }, "Replace Track Item Source");
                                        sourceSwapped = true;
                                    }
                                }
                            } catch (edErr) {
                                console.warn("SequenceEditor note:", edErr);
                            }
                        }

                        processBtn.disabled = false;
                        statusBox.innerText = "Status: Reconstruction Successful. 35mm Master Compiled.";
                        updateProgressUI(100.0, "Reconstruction Complete!", "Master compiled & active timeline clip updated.", true);
                    } else {
                        processBtn.disabled = false;
                        statusBox.innerText = "Status: Process complete, master file exported to disk.";
                        updateProgressUI(100.0, "Render Complete", "Master video saved to disk.", true);
                    }
                } catch (importErr) {
                    processBtn.disabled = false;
                    statusBox.innerText = "Asset Swap Error: " + importErr.toString();
                    updateProgressUI(100.0, "Master Rendered", "File created, bin swap note: " + importErr.message, true);
                }

            } catch (err) {
                processBtn.disabled = false;
                statusBox.textContent = `Status Error: ${err.message}`;
                updateProgressUI(0, "Error", err.message, false);
            }
        });

        // Initialize display values
        updateDisplays();
    </script>
</body>
</html>
